[project]
name = "boomer"
version = "0.1.0"
description = "Hybrid linear-attention diffusion for text-to-image generation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets",
  "diffusers>=0.38.0",
  "einops>=0.8.2",
  "numpy",
  "pillow",
  "safetensors",
  "scipy",
  "sentencepiece",
  "torch",
  "torchvision",
  "transformers>=5.9.0",
  "webdataset",
]

[project.optional-dependencies]
train = ["lightning", "pyarrow", "wandb"]
dev = ["pytest"]
# Dion main includes the split_sizes param-group API required by CMuon. Pin the
# reviewed revision so a future optimizer API change cannot silently alter a run.
cmuon = ["dion @ git+https://github.com/microsoft/dion.git@0a059a4542e5aa74b40dcd1dce363836c7afcd48"]

[tool.setuptools.packages.find]
include = ["boomer*"]
